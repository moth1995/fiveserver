[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fiveserver-async"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "asyncmy==0.2.17",
    "dataclasses-struct==1.5.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "PyYAML==6.0.3",
    "pycryptodome==3.23.0",
]

[project.scripts]
fiveserver = "fiveserver.server:main"

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.14.8", "mypy==1.18.2", "pylint==3.3.8", "radon==6.0.1"]
audit = ["pip-audit==2.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
plugins = ["dataclasses_struct.ext.mypy_plugin"]

[[tool.mypy.overrides]]
module = ["yaml"]
follow_untyped_imports = true

[tool.pylint.typecheck]
# dataclasses_struct adds these at runtime; static analysis can't see them
generated-members = ["pack", "from_packed"]
