{% extends "public/base.html" %}
{% block title %}{{ "Success" if success else "Error" }}{% endblock %}

{% block content %}
<div class="container page-section">
  <div class="register-card">
    {% if success %}
    <h2 class="register-title register-success">&#10003; Success</h2>
    {% else %}
    <h2 class="register-title register-error">&#10007; Error</h2>
    {% endif %}
    <p class="register-message">{{ message }}</p>
    <a href="/register">← Back to registration</a>
  </div>
</div>
{% endblock %}
