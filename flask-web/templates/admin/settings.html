{% extends "admin/layout.html" %}
{% block title %}Settings{% endblock %}
{% block body %}

<form class="settings-form" method="POST" action="/admin/settings">
  <div class="form-group">
    <h2>Server</h2>

    <div class="form-row">
      <label for="max_users">Max Users</label>
      <input type="number" id="max_users" name="max_users" value="{{ max_users }}" min="1" max="10000" style="width:100px;">
    </div>
  </div>

  <div class="form-group">
    <h2>Features</h2>

    <div class="form-row">
      <label for="debug">Debug Logging</label>
      <input type="checkbox" id="debug" name="debug" value="1" {% if debug %}checked{% endif %}>
    </div>

    <div class="form-row">
      <label for="store_settings">Store Settings</label>
      <input type="checkbox" id="store_settings" name="store_settings" value="1" {% if store_settings %}checked{% endif %}>
    </div>

    <div class="form-row">
      <label for="roster_check">Roster Check</label>
      <input type="checkbox" id="roster_check" name="roster_check" value="1" {% if roster_check %}checked{% endif %}>
    </div>
  </div>

  <div class="form-row" style="margin-top:16px;">
    <button class="btn btn-primary" type="submit">Save Settings</button>
  </div>
</form>

{% if saved %}
<p style="color:#22c55e;margin-top:12px;">Settings saved.</p>
{% endif %}

{% endblock %}
