{% extends "admin/layout.html" %}
{% block title %}Server Log{% endblock %}
{% block body %}

<form class="log-controls" method="GET" action="">
  <label>Log:</label>
  <select name="log" onchange="this.form.submit()">
    <option value="fiveserver" {% if selected_log == 'fiveserver' %}selected{% endif %}>Game server</option>
    <option value="webserver"  {% if selected_log == 'webserver'  %}selected{% endif %}>Web server</option>
  </select>
  <label>Show last:</label>
  <select name="lines" onchange="this.form.submit()">
    {% for n in [30, 100, 500, 1000, 5000] %}
    <option value="{{ n }}" {% if n == line_count %}selected{% endif %}>{{ n }} lines</option>
    {% endfor %}
  </select>
</form>

<pre class="log-viewer" id="logViewer">{{ lines | join('\n') | e }}</pre>

<script>
(function() {
  var el = document.getElementById('logViewer');
  if (el) el.scrollTop = el.scrollHeight;
})();
</script>

{% endblock %}
