name: CI

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_GO: ghcr.io/${{ github.repository_owner }}/fiveserver
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/fiveserver-web

jobs:
  # ── Go: lint & coverage ──────────────────────────────────────────────────────
  go:
    name: Go — lint & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiveserver-go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: fiveserver-go

      - name: go test with coverage
        run: |
          COVER_PKGS=$(go list ./internal/... | tr '\n' ',')
          go test ./tests/... \
            -covermode=atomic \
            -coverpkg="${COVER_PKGS%,}" \
            -coverprofile=coverage.out

      - name: coverage summary
        run: go tool cover -func=coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: fiveserver-go/coverage.out

  # ── Python: lint & coverage ──────────────────────────────────────────────────
  python:
    name: Python — lint & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-cov

      - name: ruff check (lint + unused imports/vars)
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: pytest with coverage
        run: |
          pytest --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: flask-web/coverage.xml

  # ── Docker: build both images ────────────────────────────────────────────────
  build:
    name: Docker — build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build fiveserver-go image
        uses: docker/build-push-action@v6
        with:
          context: ./fiveserver-go
          file: ./fiveserver-go/Dockerfile
          push: false
          tags: ${{ env.IMAGE_GO }}:build-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build flask-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./flask-web/Dockerfile
          push: false
          tags: ${{ env.IMAGE_WEB }}:build-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release: push images + create GitHub release ─────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Push fiveserver-go image
        uses: docker/build-push-action@v6
        with:
          context: ./fiveserver-go
          file: ./fiveserver-go/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_GO }}:${{ github.ref_name }}
            ${{ env.IMAGE_GO }}:latest
          cache-from: type=gha

      - name: Push flask-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./flask-web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.ref_name }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "fiveserver ${{ github.ref_name }}"
