Name: Fiveserver Configuration File
Version: 1.8

Comment: |
    NOTE that GamePorts should not be changed, because the corresponding
    games have those values hardcoded into them.

ServerIP: 127.0.0.1
ListenOn: ""
IpDetectUri: "http://mapote.com/cgi-bin/ip.py"

Lobbies:
    - 'Russia'
    - 'England'
    - 'Italy'
    - 'Spain'
    - 'Germany'
    - 'EuroLeague'
    - name: 'Playground'
      type: ['A']
    - name: 'Training'
      type: noStats
      showMatches: False
    - 'Guest Lobby'

GamePorts:
    pes2008: 11881

NetworkServer:
    mainService: 20300
    networkMenuService: 20301
    loginService:
        pes2008: 20302

WebInterface:
    port: 8290

Debug:
    true

DB:
    name: eightserver
    user: eightserver
    password: proevo
    readServers: [127.0.0.1]
    writeServers: [127.0.0.1]
    sharePool: True
    ConnectionPool:
        minConnections: 3
        maxConnections: 5
        keepAliveInterval: 60

BannedList: ./etc/data/banned8.yaml

Chat:
    bannedWords: []
    warningMessage: "message was removed because it contains banned words"

Roster:
    enforceHash: false
    compareHash: true

ClientVersion:
    enforce: false
    minimum: "1.20"

ComputeRanksInterval:
    days: 1
    seconds: 0

StoreSettings: true

ShowStats: true

#Disconnects:
#    CountAsLoss:
#        Enabled: false
#        Score:
#            player: 0
#            opponent: 3

ServerName: "Fiveserver"

Greeting:
    "text": "\
Welcome to Fiveserver -\n\
independent community server\n\
supporting PES2008 games.\n\
Have a good time, play some nice\n\
football and try to score goals.\n\
\n\
Credits:\r\n\
Protocol analysis: reddwarf, juce\n\
Server programming: juce, reddwarf"
