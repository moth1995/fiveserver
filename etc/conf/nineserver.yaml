Name: Fiveserver Configuration File
Version: 1.8

Comment: |
    NOTE that GamePorts should not be changed, because the corresponding
    games have those values hardcoded into them.

ServerIP: auto
ListenOn: ""
IpDetectUri: "http://mapote.com/cgi-bin/ip.py"

Lobbies:
    - 'Russia'
    - 'England'
    - 'Italy'
    - 'Spain'
    - 'Germany'
    - 'EuroLeague'
    - name: 'Playground'
      type: ['A']
    - name: 'Training'
      type: noStats
      showMatches: False
    - 'Guest Lobby'

GamePorts:
    pes2009: 20010

NetworkServer:
    mainService: 20030
    networkMenuService: 20085
    loginService:
        pes2009: 20020

WebInterface:
    port: 9190
    # HTTPS: auth.php login, EULAs, ranking... (see WebBaseUrl).
    # Create + trust the cert first: python scripts/make_pes2009_cert.py
    sslPort: 9193  # 9191/9192 = admin/stats (admin9.yaml AdminPort)
    #sslKey: etc/keys/pes2009web-key.pem
    #sslCert: etc/keys/pes2009web-cert.pem

# Replaces http(s)://pes2009web.winning-eleven.net in the in-game web list
# (packet 0x2202: EULAs, auth.php login, ranking...).
# The game picks TLS by PORT, not by scheme: port 80 = plain HTTP, any other
# port = HTTPS. So with a custom port this must be the sslPort, and the cert
# must cover this host (IP or name).
# Unset = Konami's original URLs (hosts-file redirect + ports 80 and 443).
WebBaseUrl: "https://127.0.0.1:9193"

Debug:
    false

DB:
    name: nineserver
    user: nineserver
    password: proevo
    readServers: [127.0.0.1]
    writeServers: [127.0.0.1]
    sharePool: True
    ConnectionPool:
        minConnections: 3
        maxConnections: 5
        keepAliveInterval: 60

BannedList: ./etc/data/banned9.yaml

Chat:
    bannedWords: []
    warningMessage: "message was removed because it contains banned words"

Roster:
    enforceHash: false
    compareHash: true

ComputeRanksInterval:
    days: 1
    seconds: 0

StoreSettings: true

ShowStats: true

#Disconnects:
#    CountAsLoss:
#        Enabled: false
#        Score:
#            player: 0
#            opponent: 3

ServerName: "Fiveserver"

Greeting:
    "text": "\
Welcome to Fiveserver -\n\
independent community server\n\
supporting PESS2009 games.\n\
Have a good time, play some nice\n\
football and try to score goals.\n\
\n\
Credits:\r\n\
Protocol analysis: reddwarf, juce\n\
Server programming: juce, reddwarf"

