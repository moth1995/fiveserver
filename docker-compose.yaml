services:
  fiveserver-db:
    image: ${DB_IMAGE:-mysql:8}
    container_name: fiveserver-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fiveserver
      MYSQL_USER: fiveserver
      MYSQL_PASSWORD: we9le
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - fiveserver-db-data:/var/lib/mysql
    networks:
      - fiveserver-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 10

  sixserver-db:
    image: ${DB_IMAGE:-mysql:8}
    container_name: sixserver-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sixserver
      MYSQL_USER: sixserver
      MYSQL_PASSWORD: proevo
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./sql/schema6.sql:/docker-entrypoint-initdb.d/01-schema6.sql:ro
      - sixserver-db-data:/var/lib/mysql
    networks:
      - sixserver-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 10

  nineserver-db:
    image: ${DB_IMAGE:-mysql:8}
    container_name: nineserver-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nineserver
      MYSQL_USER: nineserver
      MYSQL_PASSWORD: proevo
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./sql/schema9.sql:/docker-entrypoint-initdb.d/01-schema9.sql:ro
      - nineserver-db-data:/var/lib/mysql
    networks:
      - nineserver-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 10

  fiveserver:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fiveserver
    restart: unless-stopped
    depends_on:
      fiveserver-db:
        condition: service_healthy
    environment:
      SVC: fiveserver
    volumes:
      - ./etc:/opt/fiveserver/etc
      - ./log:/opt/fiveserver/log
      - ./web:/opt/fiveserver/web
    ports:
      - "16001:16001"
      - "18001:18001"
      - "19501:19501"
      - "20100-20104:20100-20104"
      - "8180:8180"
      # - "8181:8181" # Uncomment if you want to enable the web admin interface for PES 5
    networks:
      - fiveserver-net

  sixserver:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sixserver
    restart: unless-stopped
    depends_on:
      sixserver-db:
        condition: service_healthy
    environment:
      SVC: sixserver
    volumes:
      - ./etc:/opt/fiveserver/etc
      - ./log:/opt/fiveserver/log
      - ./web6:/opt/fiveserver/web6
    ports:
      - "10881:10881"
      - "20200-20203:20200-20203"
      - "8190:8190"
      # - "8191:8191" # Uncomment if you want to enable the web admin interface for PES 6
    networks:
      - sixserver-net

  # PES2009. In etc/conf/nineserver.yaml set DB readServers/writeServers to
  # [nineserver-db] and WebBaseUrl to https://<public host>:9193, and create
  # the TLS cert for that host: python scripts/make_pes2009_cert.py <host>
  nineserver:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nineserver
    restart: unless-stopped
    depends_on:
      nineserver-db:
        condition: service_healthy
    environment:
      SVC: nineserver
    volumes:
      - ./etc:/opt/fiveserver/etc
      - ./log:/opt/fiveserver/log
      - ./web9:/opt/fiveserver/web9
    ports:
      - "20010:20010"
      - "20020:20020"
      - "20030:20030"
      - "20085:20085"
      - "9190:9190"
      - "9193:9193"
      # - "9191:9191" # Uncomment if you want to enable the web admin interface for PES 2009
    networks:
      - nineserver-net

volumes:
  fiveserver-db-data:
  sixserver-db-data:
  nineserver-db-data:

networks:
  fiveserver-net:
    driver: bridge
  sixserver-net:
    driver: bridge
  nineserver-net:
    driver: bridge